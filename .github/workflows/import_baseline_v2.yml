name: Import baseline archive v2

on:
  push:
    paths:
      - '.import2/**'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check all chunks
        id: check
        shell: bash
        run: |
          missing=0
          for i in $(seq -w 0 15); do
            if [ ! -f ".import2/chunk_$i.b64" ]; then
              missing=1
            fi
          done
          echo "ready=$((1-missing))" >> "$GITHUB_OUTPUT"
      - name: Reconstruct and import project
        if: steps.check.outputs.ready == '1'
        shell: bash
        run: |
          cat .import2/chunk_*.b64 | base64 -d > /tmp/baseline.zip
          rm -rf /tmp/baseline
          mkdir -p /tmp/baseline
          unzip -q /tmp/baseline.zip -d /tmp/baseline
          rsync -a --exclude '.git' --exclude '.import' --exclude '.import2' /tmp/baseline/DataHauseWare-main/ ./
          rm -rf .import2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import existing project baseline from archive"
            git push
          fi
