name: Import baseline archive

on:
  push:
    paths:
      - '.baseline-import/**'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check archive chunks
        id: check
        shell: bash
        run: |
          missing=0
          for i in $(seq -w 0 7); do
            [ -f ".baseline-import/chunk_$i.b64" ] || missing=1
          done
          echo "ready=$((1-missing))" >> "$GITHUB_OUTPUT"
      - name: Restore exact baseline
        if: steps.check.outputs.ready == '1'
        shell: bash
        run: |
          cat .baseline-import/chunk_*.b64 | base64 -d > /tmp/baseline.zip
          rm -rf /tmp/baseline
          mkdir -p /tmp/baseline
          unzip -q /tmp/baseline.zip -d /tmp/baseline
          rsync -a --delete             --exclude '.git'             --exclude '.baseline-import'             --exclude '.import'             --exclude '.import2'             --exclude '.import3'             /tmp/baseline/DataHauseWare-main/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import existing project baseline from source archive" || true
          git push
